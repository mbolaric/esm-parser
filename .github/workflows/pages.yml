name: Product Website

on:
  push:
    branches: ["master"]
    paths:
      - "docs/site/**"
      - "src/**"
      - "types/**"
      - "scripts/build-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "docs/site/**"
      - "src/**"
      - "types/**"
      - "scripts/build-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build product website
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Test static website
        run: node --test docs/site/*.test.mjs
      - name: Build browser parser
        run: ./scripts/build-wasm.sh --release
      - name: Build static website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node docs/site/build.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload product website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/master' || (github.event_name == 'release' && github.event.release.prerelease == false)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy product website
        id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "esm-parser"
version = "0.2.0"
authors = ["Milan Bolaric"]
edition = "2024"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/mbolaric/esm-parser"
description = "Library for parsing ESM files (.DDD). *.DDD files are digital exports of tachograph data and contain all mandatory information required by EU regulations."
keywords = ["tachograph", "tacho", "DDD", "parsing"]
include = [
    "src/**/*",
    "types/**/*",
    "examples/**/*",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

categories = ["parser-implementations"]

[profile.release]
codegen-units = 1
debug = "full"
lto = true
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM
strip = "symbols"
incremental = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
logging = ["binary-data/logging"]
wasm-console-panic-hook = []

[dependencies]
log = { version = "0.4.33", default-features = false }

binary-data = { git = "https://github.com/mbolaric/binary-data.git", default-features = false }
time = { version = "0.3.41", features = ["macros", "formatting"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.41.0", features = ["serialize"] }

# Cert verify
num-bigint = "0.5.1"
sha1 = "0.11.0"

# Gen2 ECC certificate verification (brainpoolP256r1 + ECDSA/SHA-256).
# `bp256` has no stable release with the `arithmetic` feature needed for
# ECDSA verification (last stable 0.5.0 lacks it entirely). We use the
# latest RC where arithmetic is a normal feature. Track upstream:
# https://github.com/RustCrypto/elliptic-curves
bp256 = { version = "0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"] }
sha2 = { version = "0.11", default-features = false }
signature = { version = "3.0.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.126", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3.103", features = ['console'] }

[dev-dependencies]
log4rs = "1.4.0"
clap = { version = "4.6.3", features = ["derive"] }
indicatif  = "0.18.6"

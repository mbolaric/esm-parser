[package]
name = "esm-parser"
version = "0.4.1"
authors = ["Milan Bolaric"]
edition = "2024"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/mbolaric/esm-parser"
description = "Library for parsing ESM files (.DDD). *.DDD files are digital exports of tachograph data and contain all mandatory information required by EU regulations."
keywords = ["tachograph", "tacho", "DDD", "parsing"]
include = [
    "/src/**/*",
    "/types/**/*",
    "/scripts/**/*",
    "/examples/*.rs",
    "/examples/helpers/**/*",
    "/examples/web/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

categories = ["parser-implementations"]

[profile.release]
codegen-units = 1
debug = "full"
lto = true
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM
strip = "symbols"
incremental = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-types"
path = "src/bin/generate_types.rs"
required-features = ["typescript"]

[features]
default = []
logging = ["binary-data/logging"]
typescript = ["dep:ts-rs"]
wasm-console-panic-hook = []

[dependencies]
log = { version = "0.4.34", default-features = false }

binary-data = { version = "0.2.1", default-features = false }
time = { version = "0.3.55", features = ["macros", "formatting"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
ts-rs = { version = "=12.0.1", optional = true }

# Cert verify
num-bigint = "0.5.1"
sha1 = "0.11.0"

# Gen2 ECC certificate verification (brainpoolP256r1 + ECDSA/SHA-256).
bp256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"] }
sha2 = { version = "0.11", default-features = false }
signature = { version = "3.0.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.128", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3.105", features = ['console'] }

[dev-dependencies]
log4rs = { version = "1.4.0", default-features = false, features = ["console_appender"] }
clap = { version = "4.6.7", features = ["derive"] }
indicatif  = "0.18.6"
